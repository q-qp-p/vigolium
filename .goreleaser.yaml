version: 2

project_name: vigolium
dist: build/dist

snapshot:
  version_template: "{{ if .Env.VIGOLIUM_VERSION }}{{ .Env.VIGOLIUM_VERSION }}{{ else }}0.0.1-alpha{{ end }}"

before:
  hooks:
    - go mod tidy

builds:
  - id: vigolium
    main: ./cmd/vigolium
    binary: vigolium
    # Stage the matching vigolium-audit blob into the go:embed path before
    # each target builds. The embed path is a single shared file, so builds
    # MUST run sequentially — see `--parallelism 1` in the snapshot/release
    # make targets. Without this, every cross-compiled binary embeds the host
    # blob (e.g. a macOS arm64 audit binary shipped inside a linux/amd64
    # build).
    hooks:
      pre:
        - cmd: bash build/scripts/stage-audit-blob.sh {{ .Os }} {{ .Arch }}
    env:
      - CGO_ENABLED=0
    flags:
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/vigolium/vigolium/pkg/cli.Version=v{{.Version}}
      - -X github.com/vigolium/vigolium/pkg/cli.Commit={{.ShortCommit}}
      - -X github.com/vigolium/vigolium/pkg/cli.BuildTime={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # windows/arm64 is deliberately not shipped: the two embedded helper
    # binaries (vigolium-audit, jstangle) are `bun build --compile` outputs and
    # Bun has no bun-windows-arm64 target, so an arm64 Windows build would ship
    # with the audit driver broken and jstangle silently stubbed out. Windows on
    # ARM runs the amd64 build under emulation instead.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
    # zip on Windows: tar.gz needs a third-party tool on older Windows, and zip
    # is what every Windows install path (Explorer, Expand-Archive) handles.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "vigolium_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: vigolium
    name: vigolium
