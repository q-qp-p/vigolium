  validate:
    if: needs.prepare.outputs.validate == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: .
      - uses: cachix/install-nix-action@v31
      - name: Build and test the package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          nix flake check
          nix build --out-link "$RUNNER_TEMP/vigolium-result"
          if [ "$RUNNER_OS" = Linux ] && [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            # Permit only this test's exact Nix bubblewrap executable to create
            # user namespaces. The runner is disposable; system-wide AppArmor
            # restrictions stay enabled.
            bwrap="$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.${builtins.currentSystem}.bubblewrap.outPath')/bin/bwrap"
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile vigolium-ci-bwrap "%s" flags=(unconfined) {\n  userns,\n}\n' "$bwrap" | sudo tee /etc/apparmor.d/vigolium-ci-bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/vigolium-ci-bwrap
          fi
          "$RUNNER_TEMP/vigolium-result/bin/vigolium" version | tee "$RUNNER_TEMP/vigolium-version.txt"
          grep -F "$VERSION" "$RUNNER_TEMP/vigolium-version.txt"
          "$RUNNER_TEMP/vigolium-result/bin/vigolium" --help
